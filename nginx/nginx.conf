# =============================================================================
# nginx.conf - Configuração do Nginx como proxy reverso
# Serve arquivos estáticos e media diretamente, redireciona o resto ao Daphne.
# Suporta subdomínios wildcard para multi-tenant.
# Inclui suporte a WebSocket (upgrade HTTP para WS).
# =============================================================================

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name *.meusistema.com meusistema.com localhost;

    # Tamanho máximo de upload (para imagens de produtos)
    client_max_body_size 10M;

    # Certbot challenge (necessário para HTTPS com Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Arquivos estáticos (CSS, JS, imagens do tema)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Arquivos de media (uploads de imagens de produtos)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy para o Django/Daphne (com suporte a WebSocket)
    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_redirect off;
    }
}

