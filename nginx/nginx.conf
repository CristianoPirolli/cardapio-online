# =============================================================================
# nginx.conf - Configuração do Nginx como proxy reverso
# Serve arquivos estáticos e media diretamente, redireciona o resto ao Daphne.
# Suporta subdomínios wildcard para multi-tenant.
# Inclui suporte a WebSocket (upgrade HTTP para WS).
# =============================================================================

upstream django {
    server web:8000;
}

# HTTP -> HTTPS (com suporte ao desafio ACME do certbot)
server {
    listen 80;
    server_name panificadoraoneda.com.br www.panificadoraoneda.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name panificadoraoneda.com.br www.panificadoraoneda.com.br;

    ssl_certificate /etc/letsencrypt/live/panificadoraoneda.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panificadoraoneda.com.br/privkey.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://django;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
    }
}

