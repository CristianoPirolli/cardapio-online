# =============================================================================
# docker-compose.yml - Orquestração dos serviços do Cardápio Online SaaS
# Serviços: PostgreSQL, Django (Gunicorn), Nginx
# Uso: docker-compose up --build -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Banco de dados PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Aplicação Django servida pelo Gunicorn
  # ---------------------------------------------------------------------------
  web:
    build: .
    restart: always
    command: >
      sh -c "
        python manage.py migrate --noinput &&
        python manage.py shell -c \"import os; from django.contrib.auth import get_user_model; U=get_user_model(); username=os.environ.get('DJANGO_SUPERUSER_USERNAME', 'admin'); email=os.environ.get('DJANGO_SUPERUSER_EMAIL', 'admin@localhost.com'); password=os.environ.get('DJANGO_SUPERUSER_PASSWORD', 'admin123'); user, created = U.objects.get_or_create(username=username, defaults={'email': email, 'is_staff': True, 'is_superuser': True}); user.is_staff = True; user.is_superuser = True; user.email = user.email or email; user.set_password(password) if created else None; user.save(); print('Superuser pronto:', username)\" &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  # ---------------------------------------------------------------------------
  # Nginx como proxy reverso e servidor de arquivos estáticos/media
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
