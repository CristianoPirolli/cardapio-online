<!-- ==========================================================================
     templates/painel/configuracoes.html - Configurações do restaurante

     Formulário para editar dados do restaurante.
     ========================================================================== -->
{% extends 'painel/base_painel.html' %}
{% load crispy_forms_tags %}

{% block title %}Configurações - {{ restaurante.nome }}{% endblock %}

{% block painel_content %}
<h1 class="h2 mb-3"><i class="bi bi-gear"></i> Configurações</h1>

<div class="card shadow-sm">
    <div class="card-body">
        <div class="alert alert-info d-flex justify-content-between align-items-center flex-wrap gap-2" role="alert">
            <div>
                <i class="bi bi-info-circle me-1"></i>
                Tamanhos de pizza agora ficam no menu <strong>Pizzas</strong>.
            </div>
            <a href="{% url 'painel_pizzas' %}" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-pie-chart me-1"></i>Ir para Pizzas
            </a>
        </div>

        <form method="post" enctype="multipart/form-data" hx-encoding="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <hr>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Salvar Alterações
            </button>
        </form>
    </div>
</div>
{% endblock %}
