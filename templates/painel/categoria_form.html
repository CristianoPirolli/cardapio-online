<!-- ==========================================================================
     templates/painel/categoria_form.html - Formulário de categoria
     ========================================================================== -->
{% extends 'painel/base_painel.html' %}
{% load crispy_forms_tags %}

{% block title %}{{ titulo }} - {{ restaurante.nome }}{% endblock %}

{% block painel_content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h2"><i class="bi bi-tags"></i> {{ titulo }}</h1>
    <a href="{% url 'painel_categorias' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <hr>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg"></i> Salvar
            </button>
        </form>
    </div>
</div>
{% endblock %}
